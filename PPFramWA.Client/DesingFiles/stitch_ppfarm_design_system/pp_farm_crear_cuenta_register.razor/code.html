<!DOCTYPE html>

<html class="dark" lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0" name="viewport"/><meta content="web_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><style>@layer base{html,body{margin:0;padding:0;}body{overscroll-behavior:none;}main>:first-child{margin-top:0!important;}main>:last-child{margin-bottom:0!important;}}::-webkit-scrollbar{display:none;}.farm-checkered-bg{background-color:#5fa035;background-image:linear-gradient(45deg,#6cb33f 25%,transparent 25%),linear-gradient(-45deg,#6cb33f 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#6cb33f 75%),linear-gradient(-45deg,transparent 75%,#6cb33f 75%);background-size:64px 64px;background-position:0 0,0 32px,32px -32px,-32px 0;}</style><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config={"darkMode":"class","theme":{"extend":{"colors":{"inverse-surface":"#e0e1f5","on-primary-fixed":"#092100","background":"#101320","on-secondary":"#412d00","secondary":"#febf2b","on-surface-variant":"#c1cab5","outline":"#8b9481","surface-container-lowest":"#0a0d1b","tertiary":"#bdc5e9","on-error-container":"#ffdad6","surface-dim":"#101320","surface-container":"#1c1f2d","surface-tint":"#90da60","primary-fixed":"#aaf779","on-error":"#690005","surface-container-highest":"#313443","error-container":"#93000a","primary-fixed-dim":"#90da60","on-primary-fixed-variant":"#225100","on-surface":"#e0e1f5","on-secondary-fixed":"#261900","on-tertiary-container":"#2f3754","primary":"#90da60","on-tertiary":"#272f4c","on-tertiary-fixed-variant":"#3e4663","inverse-on-surface":"#2d303f","surface":"#101320","surface-container-high":"#262938","outline-variant":"#41493a","secondary-container":"#dfa400","on-primary-container":"#194100","on-tertiary-fixed":"#121a36","on-secondary-fixed-variant":"#5d4200","tertiary-fixed-dim":"#bdc5e9","tertiary-container":"#98a0c3","secondary-fixed-dim":"#fbbc28","secondary-fixed":"#ffdea4","surface-variant":"#313443","error":"#ffb4ab","primary-container":"#6cb33f","surface-bright":"#363848","inverse-primary":"#2f6c00","on-background":"#e0e1f5","surface-container-low":"#181b29","on-secondary-container":"#563d00","on-primary":"#153800","tertiary-fixed":"#dce1ff"},"borderRadius":{"DEFAULT":"0.25rem","lg":"0.5rem","xl":"0.75rem","full":"9999px"},"spacing":{"gutter":"1rem","space-lg":"1.5rem","space-md":"1rem","margin-mobile":"1rem","margin":"1.5rem","gutter-mobile":"0.5rem","space-xl":"2rem","space-xs":"0.25rem","space-sm":"0.5rem"},"fontFamily":{"label-md":["Rubik"],"headline-md":["Rubik"],"label-sm":["Rubik"],"headline-lg":["Rubik"],"label-lg":["Rubik"],"headline-xl":["Rubik"],"body-lg":["Rubik"],"headline-xl-mobile":["Rubik"],"body-md":["Rubik"]},"fontSize":{"label-md":["12px",{"lineHeight":"16px","letterSpacing":"0.06em","fontWeight":"700"}],"headline-md":["18px",{"lineHeight":"24px","letterSpacing":"0.02em","fontWeight":"700"}],"label-sm":["10px",{"lineHeight":"14px","letterSpacing":"0.08em","fontWeight":"700"}],"headline-lg":["22px",{"lineHeight":"28px","letterSpacing":"0.03em","fontWeight":"700"}],"label-lg":["14px",{"lineHeight":"18px","letterSpacing":"0.05em","fontWeight":"700"}],"headline-xl":["32px",{"lineHeight":"40px","letterSpacing":"0.04em","fontWeight":"800"}],"body-lg":["16px",{"lineHeight":"24px","letterSpacing":"0.01em","fontWeight":"500"}],"headline-xl-mobile":["24px",{"lineHeight":"32px","letterSpacing":"0.03em","fontWeight":"800"}],"body-md":["14px",{"lineHeight":"20px","letterSpacing":"0em","fontWeight":"400"}]}}}};</script></head><body class="min-h-screen w-full farm-checkered-bg font-body-md text-body-md text-on-surface antialiased flex flex-col justify-center items-center relative overflow-x-hidden selection:bg-secondary selection:text-on-secondary"><div class="fixed inset-0 pointer-events-none bg-[radial-gradient(circle_at_center,transparent_0%,rgba(13,16,23,0.6)_100%)] z-0"></div><main class="relative z-10 w-full flex items-center justify-center p-gutter-mobile sm:p-margin"><div class="flex flex-col w-full items-center justify-center p-gutter-mobile sm:p-gutter">
<!-- PP FARM LOGO ICON STRIP -->
<div class="flex items-center gap-space-sm mb-space-md select-none">
<div class="w-8 h-8 bg-surface-container-low border-2 border-[#3f4765] shadow-[0_3px_0_0_#0d1017] flex items-center justify-center">
<span class="material-symbols-outlined text-secondary text-[20px]" style="font-variation-settings: 'FILL' 1;">potted_plant</span>
</div>
<span class="font-headline-lg text-secondary tracking-widest uppercase drop-shadow-[0_2px_0_#0d1017]">PP FARM</span>
</div>
<!-- MAIN REGISTRATION MODAL CHASSIS (Faithful to Register.razor & TiendaModal/InventarioModal) -->
<div class="w-full max-w-[420px] bg-[#1f2438] border-4 border-[#0d1017] shadow-[inset_0_2px_0_0_#535d82,inset_0_-2px_0_0_#181b29,0_8px_0_0_#0a0d1b] relative p-1">
<!-- Corner Pixel Accents (Brass/Gold Trims) -->
<div class="absolute -top-1 -left-1 w-2.5 h-2.5 bg-secondary border border-[#0d1017] pointer-events-none"></div>
<div class="absolute -top-1 -right-1 w-2.5 h-2.5 bg-secondary border border-[#0d1017] pointer-events-none"></div>
<div class="absolute -bottom-1 -left-1 w-2.5 h-2.5 bg-secondary border border-[#0d1017] pointer-events-none"></div>
<div class="absolute -bottom-1 -right-1 w-2.5 h-2.5 bg-secondary border border-[#0d1017] pointer-events-none"></div>
<!-- Inner Border Shell -->
<div class="border-2 border-[#3f4765] bg-[#1f2438]">
<!-- Header Strip matching InventarioModal / TiendaModal -->
<div class="bg-surface-container-low px-space-md py-space-sm border-b-2 border-[#3f4765] flex items-center justify-between">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-primary text-[18px]">person_add</span>
<h1 class="font-headline-md text-secondary uppercase tracking-wider drop-shadow-[0_2px_0_#0a0d1b]">Crear Cuenta</h1>
</div>
<div class="w-3.5 h-3.5 bg-surface-container-high border border-[#0d1017] flex items-center justify-center">
<div class="w-1.5 h-1.5 bg-primary"></div>
</div>
</div>
<div class="p-space-md flex flex-col gap-space-md">
<!-- Error Message Display Block (C# @mensajeError state) -->
<div class="mensaje-error hidden bg-error-container/80 border-2 border-error p-space-sm flex items-start gap-space-xs shadow-[inset_0_1px_0_0_rgba(255,255,255,0.2)]" id="errorBox">
<span class="material-symbols-outlined text-error text-[18px] select-none">error</span>
<span class="font-label-md text-on-error-container tracking-wide" id="errorMessage">Por favor completa todos los campos</span>
</div>
<!-- Form container matching @onsubmit="ProcesarRegistro" -->
<form class="flex flex-col gap-space-md" id="registroForm" onsubmit="event.preventDefault(); window.procesarRegistro();">
<!-- Field: Username -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-on-surface-variant uppercase tracking-wider flex items-center gap-1 select-none">
<span class="material-symbols-outlined text-[14px]">badge</span>
              Usuario
            </label>
<div class="relative bg-[#121520] border-2 border-[#33394f] shadow-[inset_0_2px_0_0_#0d1017,inset_0_-1px_0_0_#252b42] focus-within:border-secondary focus-within:ring-0 transition-colors">
<input autocomplete="username" class="w-full bg-transparent px-3 py-2 text-on-surface font-body-md placeholder-[#7e879f] outline-none focus:outline-none focus:ring-0 border-none rounded-none" id="usernameInput" name="username" placeholder="Nombre de usuario" required="" type="text"/>
</div>
</div>
<!-- Field: Email -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-on-surface-variant uppercase tracking-wider flex items-center gap-1 select-none">
<span class="material-symbols-outlined text-[14px]">mail</span>
              Correo
            </label>
<div class="relative bg-[#121520] border-2 border-[#33394f] shadow-[inset_0_2px_0_0_#0d1017,inset_0_-1px_0_0_#252b42] focus-within:border-secondary focus-within:ring-0 transition-colors">
<input autocomplete="email" class="w-full bg-transparent px-3 py-2 text-on-surface font-body-md placeholder-[#7e879f] outline-none focus:outline-none focus:ring-0 border-none rounded-none" id="emailInput" name="email" placeholder="Correo electrónico" required="" type="email"/>
</div>
</div>
<!-- Field: Password -->
<div class="flex flex-col gap-1">
<label class="font-label-sm text-on-surface-variant uppercase tracking-wider flex items-center gap-1 select-none">
<span class="material-symbols-outlined text-[14px]">lock</span>
              Contraseña
            </label>
<div class="relative bg-[#121520] border-2 border-[#33394f] shadow-[inset_0_2px_0_0_#0d1017,inset_0_-1px_0_0_#252b42] focus-within:border-secondary focus-within:ring-0 transition-colors">
<input autocomplete="new-password" class="w-full bg-transparent px-3 py-2 text-on-surface font-body-md placeholder-[#7e879f] outline-none focus:outline-none focus:ring-0 border-none rounded-none" id="passwordInput" name="password" placeholder="Contraseña" required="" type="password"/>
</div>
</div>
<!-- Action Buttons Stack -->
<div class="flex flex-col gap-space-sm pt-space-xs">
<!-- Submit Button (Primary Farm Green) -->
<div>
<button class="w-full bg-[#2e7d32] hover:bg-[#388e3c] active:translate-y-[2px] active:border-b-[2px] border-2 border-[#535d82] border-b-4 border-b-[#1b4d20] text-on-primary font-headline-md tracking-wider uppercase py-2 px-space-md transition-all flex items-center justify-center gap-space-xs cursor-pointer select-none rounded-none" id="btnSubmit" type="submit">
<span class="material-symbols-outlined text-[18px]">how_to_reg</span>
<span>Crear cuenta</span>
</button>
</div>
<!-- Return to Login Button (Secondary Dark Slate) -->
<div>
<button class="volver w-full bg-[#33384f] hover:bg-[#3f4663] active:translate-y-[2px] active:border-b-[2px] border-2 border-[#3f4765] border-b-4 border-b-[#1b1e2c] text-on-surface font-label-lg tracking-wider uppercase py-2 px-space-md transition-all flex items-center justify-center gap-space-xs cursor-pointer select-none rounded-none" onclick="window.volverAlLogin();" type="button">
<span class="material-symbols-outlined text-[16px]">arrow_back</span>
<span>Volver Al Login</span>
</button>
</div>
</div>
</form>
</div>
<!-- Footer Indicator Bar -->
<div class="bg-[#121520] px-space-md py-1 border-t-2 border-[#3f4765] flex items-center justify-between font-label-sm text-outline select-none">
<span class="flex items-center gap-1">
<span class="w-2 h-2 bg-primary inline-block"></span>
          PP FARM V1.0
        </span>
<span class="text-secondary tracking-widest">SERVIDOR CONECTADO</span>
</div>
</div>
</div>
<!-- Retro Decorative Hints -->
<div class="mt-space-md flex items-center gap-space-md text-on-surface-variant font-label-sm uppercase select-none opacity-80">
<span class="flex items-center gap-1">
<kbd class="bg-surface-container-high px-1.5 py-0.5 border border-[#3f4765] text-on-surface font-label-sm">ENTER</kbd>
      Confirmar
    </span>
<span class="flex items-center gap-1">
<kbd class="bg-surface-container-high px-1.5 py-0.5 border border-[#3f4765] text-on-surface font-label-sm">ESC</kbd>
      Volver
    </span>
</div>
</div>
<script>
  window.procesarRegistro = function() {
    var user = document.getElementById('usernameInput').value.trim();
    var email = document.getElementById('emailInput').value.trim();
    var pass = document.getElementById('passwordInput').value.trim();
    var errBox = document.getElementById('errorBox');
    var errMsg = document.getElementById('errorMessage');

    if (!user || !email || !pass) {
      errMsg.textContent = 'Por favor completa todos los campos';
      errBox.classList.remove('hidden');
      return;
    }

    if (pass.length < 6) {
      errMsg.textContent = 'La contraseña debe tener al menos 6 caracteres';
      errBox.classList.remove('hidden');
      return;
    }

    // Success simulation for UI
    errBox.classList.add('hidden');
    var btn = document.getElementById('btnSubmit');
    var originalHTML = btn.innerHTML;
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span><span>Guardando granjero...</span>';
    
    setTimeout(function() {
      btn.innerHTML = '<span class="material-symbols-outlined text-[18px]">check</span><span>¡Cuenta Creada!</span>';
      setTimeout(function() {
        window.volverAlLogin();
      }, 700);
    }, 900);
  };

  window.volverAlLogin = function() {
    if (window.history.length > 1) {
      window.history.back();
    } else {
      window.location.href = '/login';
    }
  };

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      window.volverAlLogin();
    }
  });
</script></main></body></html>
