<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            pixel: ['"Press Start 2P"', 'monospace'],
            silkscreen: ['"Silkscreen"', 'monospace']

<style>
    * {
      image-rendering: pixelated;
      image-rendering: -moz-crisp-edges;
      image-rendering: crisp-edges;
      user-select: none;
      box-sizing: border-box;
    }

    /* Fondo de pasto pixel art tipo tablero ajedrezado verde */
    .bg-checker-grass {
      background-color: #8bc34a;
      background-image: 
        linear-gradient(45deg, #7cb342 25%, transparent 25%), 
        linear-gradient(-45deg, #7cb342 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #7cb342 75%), 
        linear-gradient(-45deg, transparent 75%, #7cb342 75%);
      background-size: 48px 48px;
      background-position: 0 0, 0 24px, 24px -24px, -24px 0px;
    }

    /* Pixel art shadows and text strokes */
    .pixel-text-shadow {
      text-shadow: 2px 2px 0px #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 2px 0 0 #000, 0 2px 0 #000;
    }
    .xp-txt {
      color: #38bdf8;
      font-weight: 900;
      text-shadow: 2px 2px 0px #03346e, -1px -1px 0 #03346e, 1px -1px 0 #03346e, -1px 1px 0 #03346e, 2px 0 0 #03346e, 0 2px 0 #03346e;
    }
    .points-txt {
      color: #facc15;
      font-weight: 900;
      text-shadow: 2px 2px 0px #78350f, -1px -1px 0 #78350f, 1px -1px 0 #78350f, -1px 1px 0 #78350f, 2px 0 0 #78350f, 0 2px 0 #78350f;
    }

    /* Barra lateral estilo Blazor PPFarm */
    .barra-lateral {
      width: 240px;
      min-width: 240px;
      background-color: #1e1e1e;
      border-right: 4px solid #333333;
      box-shadow: inset -2px 0 0 #111;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      z-index: 30;
      font-family: '"Press Start 2P"', monospace;
    }

    .barra-lateral ul {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .barra-lateral li {
      font-size: 11px;
      color: #f3f4f6;
      line-height: 1.5;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Botones de acción Blazor custom-btn */
    .custom-btn {
      width: 100%;
      background-color: #2b3945;
      color: #f8fafc;
      border: 3px solid #111827;
      box-shadow: inset 2px 2px 0 #475569, inset -2px -2px 0 #0f172a, 0 3px 0 #000;
      padding: 10px 8px;
      font-size: 10px;
      font-family: '"Press Start 2P"', monospace;
      text-align: center;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: all 0.05s steps(2);
    }
    .custom-btn:hover {
      background-color: #3b4b59;
      transform: translateY(-1px);
      box-shadow: inset 2px 2px 0 #64748b, inset -2px -2px 0 #1e293b, 0 4px 0 #000;
    }
    .custom-btn:active {
      transform: translateY(2px);
      box-shadow: inset 2px 2px 0 #0f172a, inset -2px -2px 0 #475569, 0 1px 0 #000;
    }
    .btn-guardar {
      background-color: #2e7d32 !important;
      box-shadow: inset 2px 2px 0 #4caf50, inset -2px -2px 0 #1b5e20, 0 3px 0 #000 !important;
    }
    .btn-guardar:hover {
      background-color: #388e3c !important;
    }

    .mensaje-guardado.ok {
      font-size: 8px;
      color: #4ade80;
      margin-top: 14px;
      padding: 6px;
      background: #142817;
      border: 2px solid #22543d;
      text-align: center;
      line-height: 1.4;
    }

    /* Huerta Celdas y Cerca de Madera */
    .pixel-wood-fence {
      background: #3e2213;
      border: 8px solid #241208;
      box-shadow: inset 0 0 0 4px #5e341c, 0 8px 0 rgba(0,0,0,0.45);
      outline: 3px solid #140904;
      position: relative;
    }

    /* Celda individual de cultivo */
    .huerta-celda {
      width: 58px;
      height: 58px;
      background: #4a240f;
      border: 2px solid #271206;
      box-shadow: inset 2px 2px 0 #6d3819, inset -2px -2px 0 #1e0d04;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .huerta-celda:hover {
      filter: brightness(1.12);
    }

    /* Barra de vida en cultivos */
    .life-bar-container {
      position: absolute;
      top: 3px;
      left: 5px;
      right: 5px;
      height: 4px;
      background-color: #1a1a1a;
      border: 1px solid #000;
      z-index: 10;
    }
    .life-bar-fill.hp-alta {
      height: 100%;
      width: 100%;
      background-color: #22c55e;
    }

    /* Floating harvest popup */
    @keyframes harvestFloat {
      0% { transform: translate(-50%, 0); opacity: 1; }
      50% { transform: translate(-50%, -14px); opacity: 1; }
      100% { transform: translate(-50%, -24px); opacity: 0.95; }
    }
    .cosecha-popup {
      position: absolute;
      top: -16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 40;
      display: flex;
      align-items: center;
      gap: 6px;
      pointer-events: none;
      white-space: nowrap;
      animation: harvestFloat 1.8s ease-in-out infinite alternate;
    }

    /* Equipped Frame & Hotbar */
    .equipped-frame {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #1e130c;
      border: 3px solid #451a03;
      box-shadow: inset 0 0 0 2px #78350f, 0 4px 0 #000;
      padding: 6px 12px;
    }
    .hotbar-slot {
      width: 44px;
      height: 44px;
      background: #252830;
      border: 3px solid #111419;
      box-shadow: inset 2px 2px 0 #3b4252, inset -2px -2px 0 #0d0f12;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
    }
    .hotbar-slot.active {
      border-color: #f59e0b;
      background: #343a46;
      box-shadow: inset 2px 2px 0 #fde68a, inset -2px -2px 0 #92400e, 0 0 6px rgba(245, 158, 11, 0.6);
    }
    .slot-number {
      position: absolute;
      top: 2px;
      left: 3px;
      font-size: 8px;
      color: #94a3b8;
      font-family: '"Press Start 2P"', monospace;
    }
    .slot-qty {
      position: absolute;
      bottom: 2px;
      right: 3px;
      font-size: 8px;
      color: #ffffff;
      font-family: '"Press Start 2P"', monospace;
      text-shadow: 1px 1px 0 #000;
    }
  </style>
</head>
